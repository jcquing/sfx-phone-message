<title>Text Message Prop</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    color-scheme: dark;
    --ground: #0a0d11;
    --type: #11161c;
    --type-hit: #1d2630;
    --send: #173a63;
    --send-hit: #2a5d96;
    --ink: #d7e3ef;
    --ink-soft: #6d7c8c;
    --edge: #222b35;
    --accent: #7fb8f5;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font: 16px/1.35 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .pad {
    height: 100%;
    display: grid;
    grid-template-rows: minmax(88px, 22%) 1fr;
    gap: 10px;
    padding-inline: 16px;
    padding-block: 12px;
    box-sizing: border-box;
  }
  .key {
    appearance: none;
    border: 1px solid var(--edge);
    border-radius: 18px;
    color: var(--ink);
    font: inherit;
    touch-action: manipulation;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: background-color 120ms ease-out;
  }
  .key:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .key .name { font-size: 26px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .key .sub { font-size: 13px; color: var(--ink-soft); }
  #send { background: var(--send); border-color: var(--send-hit); }
  #send.hit { background: var(--send-hit); transition: none; }
  #type { background: var(--type); }
  #type.hit { background: var(--type-hit); transition: none; }
  #type .count { font-variant-numeric: tabular-nums; }

  #start {
    position: fixed;
    inset: 0;
    background: var(--ground);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding-inline: 24px;
    text-align: center;
    z-index: 2;
  }
  #start button {
    appearance: none;
    font: inherit;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    background: var(--send);
    border: 1px solid var(--send-hit);
    border-radius: 16px;
    padding: 18px 34px;
    touch-action: manipulation;
  }
  #start p { margin: 0; color: var(--ink-soft); font-size: 14px; max-width: 30ch; }
  #start .err { color: #f28b82; }

  @media (prefers-reduced-motion: reduce) {
    .key { transition: none; }
  }
</style>

<div class="pad">
  <button id="send" class="key" type="button">
    <span class="name">Send</span>
    <span class="sub">message sent sound</span>
  </button>
  <button id="type" class="key" type="button">
    <span class="name">Type</span>
    <span class="sub">one keystroke per tap</span>
  </button>
</div>

<div id="start">
  <button id="startBtn" type="button">Tap to start</button>
  <p id="startMsg">Loads the sounds and keeps the screen awake. Turn the ringer volume up.</p>
</div>

let ctx = null;
let typingBuf = null;
let sentBuf = null;
let keyIdx = 0;
let wakeLock = null;

function b64ToArrayBuffer(dataUri) {
  const bin = atob(dataUri.slice(dataUri.indexOf(',') + 1));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

function decode(dataUri) {
  // Callback form as well as the promise, for older iOS Safari.
  return new Promise((resolve, reject) => {
    const p = ctx.decodeAudioData(b64ToArrayBuffer(dataUri), resolve, reject);
    if (p && p.then) p.then(resolve, reject);
  });
}

function ensureRunning() {
  // iOS suspends or "interrupts" audio after a lock, a call or switching apps.
  if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {});
}

async function keepAwake() {
  try {
    if ('wakeLock' in navigator && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch {}
}

function play(buf, offset, duration) {
  if (!ctx || !buf) return;
  ensureRunning();
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const gain = ctx.createGain();
  src.connect(gain).connect(ctx.destination);
  const t = ctx.currentTime;
  if (duration != null) {
    // Short fade at the end of each keystroke so the cut doesn't pop.
    const fade = Math.min(0.01, duration / 3);
    gain.gain.setValueAtTime(1, t + duration - fade);
    gain.gain.linearRampToValueAtTime(0, t + duration);
    src.start(t, offset, duration);
  } else {
    src.start(t);
  }
}

function flash(btn) {
  btn.classList.add('hit');
  setTimeout(() => btn.classList.remove('hit'), 90);
}

function bindTap(btn, action) {
  // pointerdown fires on touch contact, so the sound lands with the finger.
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    action();
    flash(btn);
  });
  // Keyboard fallback (e.g. testing on a laptop).
  btn.addEventListener('click', e => { if (e.detail === 0) { action(); flash(btn); } });
}

bindTap(document.getElementById('type'), () => {
  const [start, len] = KEYSTROKES[keyIdx];
  keyIdx = (keyIdx + 1) % KEYSTROKES.length;
  play(typingBuf, start, len);
});

bindTap(document.getElementById('send'), () => play(sentBuf));

document.getElementById('startBtn').addEventListener('click', async () => {
  const msg = document.getElementById('startMsg');
  try {
    // "playback" lets sound play with the silent switch on (iOS 17+). Older iOS ignores it.
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    // Play one silent sample inside the tap to unlock audio on iOS.
    const unlock = ctx.createBufferSource();
    unlock.buffer = ctx.createBuffer(1, 1, 22050);
    unlock.connect(ctx.destination);
    unlock.start(0);
    await ctx.resume();
    msg.textContent = 'Loading sounds…';
    [typingBuf, sentBuf] = await Promise.all([decode(TYPING_SRC), decode(SENT_SRC)]);
    keepAwake();
    document.getElementById('start').hidden = true;
  } catch (err) {
    msg.textContent = 'Sound could not start: ' + (err && err.message ? err.message : err) + '. Reload the page and tap again.';
    msg.classList.add('err');
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    ensureRunning();
    keepAwake();
  }
});

// Stop pinch and double-tap zoom from moving the buttons mid-scene.
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
</script>
